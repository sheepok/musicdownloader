name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y autoconf automake libtool build-essential \
            pkg-config zip unzip libltdl-dev cmake ninja-build \
            libffi-dev libssl-dev zlib1g-dev

      - name: Fix Android SDK structure for p4a
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/tools/bin"
            ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
            for tool in avdmanager lint apksigner; do
              [ -f "$SDK/cmdline-tools/latest/bin/$tool" ] && ln -sf "$SDK/cmdline-tools/latest/bin/$tool" "$SDK/tools/bin/$tool"
            done
            echo "Symlinks created to tools/bin/"
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-33" 2>&1 || true
          fi
          find "$SDK" -name "aidl" -type f 2>/dev/null | head -3

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_app/.buildozer
          key: buildozer-v8-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: |
            buildozer-v8-

      - name: Build APK
        run: buildozer android debug 2>&1 | tee build.log
        continue-on-error: true

      - name: Diagnose build result
        run: |
          echo "========== BUILD EXIT STATUS =========="
          echo "build.log last 30 lines:"
          tail -30 build.log
          echo ""
          echo "========== SEARCHING FOR APK =========="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found in android_app/"
          find ~ -name "*.apk" -type f 2>/dev/null | head -10 || echo "No APK found in home/"
          find /tmp -name "*.apk" -type f 2>/dev/null | head -10 || echo "No APK found in /tmp/"
          echo ""
          echo "========== BIN DIRECTORY =========="
          ls -la bin/ 2>/dev/null || echo "bin/ directory does not exist"
          echo ""
          echo "========== BUILD DIR =========="
          ls .buildozer/android/platform/build-arm64-v8a/dists/ 2>/dev/null || echo "No dists"
          echo ""
          echo "========== CRITICAL ERRORS =========="
          grep -i -E "error:|failed:|exception:|traceback|not found|no such|cannot|fatal|Fatal" build.log | head -30 || echo "(no critical errors found)"
          echo ""
          echo "========== LAST 100 LINES =========="
          tail -100 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musicdownloader-apk
          path: android_app/bin/*.apk
          if-no-files-found: warn
