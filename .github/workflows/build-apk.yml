name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y autoconf automake libtool build-essential \
            pkg-config zip unzip libltdl-dev cmake ninja-build \
            libffi-dev libssl-dev zlib1g-dev

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_app/.buildozer
          key: buildozer-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musicdownloader-apk
          path: android_app/bin/*.apk
          if-no-files-found: error
