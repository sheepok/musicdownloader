name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y autoconf automake libtool build-essential \
            pkg-config zip unzip libltdl-dev cmake ninja-build \
            libffi-dev libssl-dev zlib1g-dev

      - name: Install Android build-tools
        run: |
          # Ensure Android SDK build-tools (includes aidl) are installed
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>&1 || true
          fi
          # Verify aidl is accessible
          find $ANDROID_SDK_ROOT -name "aidl" -type f 2>/dev/null || echo "aidl not in SDK"
          which aidl 2>/dev/null || echo "aidl not in PATH"

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_app/.buildozer
          key: buildozer-v5-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: |
            buildozer-v5-

      - name: Build APK
        run: buildozer android debug 2>&1 | tee build.log

      - name: Show tail of build log on failure
        if: failure()
        run: tail -300 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musicdownloader-apk
          path: android_app/bin/*.apk
          if-no-files-found: error
