name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y autoconf automake libtool build-essential \
            pkg-config zip unzip libltdl-dev cmake ninja-build \
            libffi-dev libssl-dev zlib1g-dev

      - name: Fix Android SDK structure for p4a
        run: |
          # p4a looks for sdkmanager in old path tools/bin/sdkmanager
          # but modern SDK puts it in cmdline-tools/latest/bin/
          SDK=/usr/local/lib/android/sdk
          if [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/tools/bin"
            ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
            # Also symlink other tools that p4a might need
            for tool in avdmanager lint apksigner; do
              [ -f "$SDK/cmdline-tools/latest/bin/$tool" ] && ln -sf "$SDK/cmdline-tools/latest/bin/$tool" "$SDK/tools/bin/$tool"
            done
            echo "Symlinks created to tools/bin/"
          fi
          # Also ensure build-tools are installed
          if [ -f "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-33" 2>&1 || true
          fi
          # Verify
          ls -la "$SDK/tools/bin/" 2>/dev/null || echo "tools/bin not found"
          find "$SDK" -name "aidl" -type f 2>/dev/null | head -5

      - name: Install Python build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_app/.buildozer
          key: buildozer-v7-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: |
            buildozer-v6-

      - name: Build APK
        run: buildozer android debug 2>&1 | tee build.log

      - name: Show errors on failure
        if: failure()
        run: |
          echo "========== CRITICAL ERRORS (grep) =========="
          grep -i -E "error:|failed:|exception:|traceback|not found|no such|cannot|fatal" build.log | head -50 || echo "(no matching lines)"
          echo ""
          echo "========== LAST 500 LINES =========="
          tail -500 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musicdownloader-apk
          path: android_app/bin/*.apk
          if-no-files-found: error
